# Taps don't open the keyboard while an app (Copilot/tmux/nvim) uses the mouse,
# so add a KEYBOARD toggle button to the extra-keys bar.
extra-keys = [[{key: KEYBOARD, display: '⌨'},'ESC','/','-','HOME','UP','END','PGUP'], \
              ['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN',{key: ENTER, display: '⏎'}]]
