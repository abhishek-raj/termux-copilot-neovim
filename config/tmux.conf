set -g mouse on                      # tap panes/windows, drag borders, scroll
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g focus-events on               # lets nvim reload files when you switch to it
set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 50000
set -g status-style "bg=#1a1b26,fg=#c0caf5"
setw -g window-status-current-style "bg=#7aa2f7,fg=#1a1b26,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
set -g status-right " tap a tab to switch "
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-z resize-pane -Z
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
